name: Daily Stock Data Collector & Analyzer

on:
  schedule:
    - cron: '38 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests lxml html5lib

    - name: Run Collector Script
      run: python collector.py

    - name: Commit & Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add stock_rotation_20days.csv
        git commit -m "Auto update stock data" || exit 0
        git push

    - name: Run Analyzer Script (My Telegram)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python analyzer.py

    - name: Run Friend Analyzer Script (Friends Telegram Channel)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        FRIEND_CHAT_ID: ${{ secrets.FRIEND_CHAT_ID }}
      run: python friend_analyzer.py
